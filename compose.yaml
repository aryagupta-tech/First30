name: first30

services:
  app:
    build:
      context: .
      target: dev
    init: true
    ports:
      - "${FIRST30_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - first30_node_modules:/app/node_modules
      - first30_wrangler:/app/.wrangler
    tmpfs:
      - /app/.vinext:size=64m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  app-prod:
    profiles: ["production"]
    build:
      context: .
      target: runner
    init: true
    read_only: true
    ports:
      - "${FIRST30_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - first30_prod_wrangler:/app/.wrangler
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=1777,size=64m
      - /app/dist/server/.wrangler:uid=1001,gid=1001,mode=0700,size=64m
      - /app/node_modules/.mf:uid=1001,gid=1001,mode=0700,size=64m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  first30_node_modules:
  first30_wrangler:
  first30_prod_wrangler:
